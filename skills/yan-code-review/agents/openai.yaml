interface:
  display_name: "Yan Code Review"
  short_description: "只读审查、按 findings 修复、单 Agent 闭环与独立评审"
  default_prompt: "Use yan-code-review to select the mode matching the request; ambiguous review is read-only check. Follow the selected mode, distinguish requirement coverage from implementation risks, and report only evidence-supported findings and limitations."

policy:
  allow_implicit_invocation: true
