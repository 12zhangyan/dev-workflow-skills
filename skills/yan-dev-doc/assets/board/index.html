<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f8fa">
  <title>研发变更档案馆</title>
  <script src="js/vendor/mermaid.min.js"></script>
  <script>if (typeof mermaid === 'undefined') document.write('<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"><\/script>');</script>
  <link rel="stylesheet" href="css/board.css?v=37">
</head>
<body>
<a class="skip-link" href="#main">跳转到主要内容</a>
<header class="mobile-bar">
  <span class="mobile-brand"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></svg> 研发变更档案馆</span>
  <button type="button" class="icon-button" id="menu-toggle" aria-label="展开导航" aria-controls="sidebar" aria-expanded="false" onclick="toggleSidebar()"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
</header>
<aside class="sidebar" id="sidebar" aria-label="工作台导航">
  <div class="sidebar-header">
    <a class="sidebar-title" href="index.html" aria-label="研发变更档案馆首页"><span class="brand-mark"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></svg></span><span>研发变更档案馆<small>ONE CHANGE · ONE STORY</small></span></a>
    <div class="workspace-label"><span class="workspace-dot"></span> 项目工作空间 <span class="local-badge">LOCAL</span></div>
  </div>
  <nav class="primary-nav" aria-label="主要页面">
    <button type="button" class="log-btn" id="home-btn" onclick="showHome()"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>浏览索引</span></button>
    <button type="button" class="log-btn" id="api-btn" onclick="showApis()"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-13-2 20"/></svg><span>接口索引</span></button>
  </nav>
  <div class="nav-section-label">记录空间</div>
  <nav class="scope-filters" aria-label="记录范围">
    <button type="button" class="fpill" data-scope="workspace" onclick="setScope('workspace')"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></svg><span>工作台</span><span class="nav-count" data-count="workspace">0</span></button>
    <button type="button" class="fpill" data-scope="backlog" onclick="setScope('backlog')"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>待办库</span><span class="nav-count" data-count="backlog">0</span></button>
    <button type="button" class="fpill" data-scope="archive" onclick="setScope('archive')"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="5" rx="1"/><path d="M5 8v12h14V8M10 12h4"/></svg><span>档案库</span><span class="nav-count" data-count="archive">0</span></button>
    <button type="button" class="fpill" data-scope="all" onclick="setScope('all')"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 7V4h6l2 3h10v13H3V7Z"/></svg><span>全部记录</span><span class="nav-count" data-count="all">0</span></button>
  </nav>
  <div class="nav-section-label tree-label">服务与模块</div>
  <div class="sidebar-body" id="sb"></div>
  <div class="sidebar-footer">
    <button type="button" class="log-btn" id="log-btn" onclick="showLog()"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 11a9 9 0 1 1 3 8M3 4v7h7M12 7v5l4 2"/></svg><span>变更日志</span></button>
    <div class="sidebar-sub" id="sub"></div>
  </div>
</aside>
<div class="workspace">
  <header class="topbar">
    <div class="topbar-path">工作空间 <span>/</span> <strong id="view-label">工作台</strong></div>
    <label class="search-wrap"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input class="search" id="q" type="search" aria-label="搜索当前范围的记录" placeholder="搜索标题、服务或内容…" oninput="onSearch(this.value)"><kbd aria-hidden="true">/</kbd></label>
  </header>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<script src="data/changes.js"></script>
<script src="js/board.js?v=37"></script>
</body>
</html>
