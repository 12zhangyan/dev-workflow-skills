interface:
  display_name: "Yan Dev Doc"
  short_description: "显式需要先评审方案时生成可执行开发文档"
  default_prompt: "Use yan-dev-doc only when the user explicitly asks for a development/implementation plan, when unresolved contract, database, permission, state, transaction, or cross-module decisions require a reviewable Plan Gate before coding, or when a bug root cause is already evidenced and the user needs a repair plan. Do not invoke it for a direct implementation request whose scope and acceptance criteria are already clear. Route bug investigation without an established root cause, tester-flow, and read-only code-impact work to yan-project-analysis incident/business/understanding; route review packaging, read-only review, findings repair, and same-agent closure to yan-code-review package/check/repair/loop. The core artifact is the md plan; publish or upgrade the HTML board by default for Standard and IncrementalRevision unless the user explicitly opts out or an applicable project rule prohibits it. Compact does not publish a board. Select Compact for an explicitly requested small same-module backward-compatible plan, and prefer IncrementalRevision when prior yan-dev-docs are supplied."

policy:
  allow_implicit_invocation: true
